<meta name="mobile-web-app-capable" content="yes">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #111; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: #111;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(20px, 5vw, 28px);
    /* Fill the whole screen, keeping clear of the notch and home bar */
    padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             24px calc(16px + env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
  }
  .wrap { width: 100%; max-width: 820px; margin: 0 auto; }

  h1 { font-size: clamp(30px, 8vw, 44px); text-align: center; margin: 8px 0 20px; }

  button {
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(24px, 6.5vw, 36px);
    color: #111;
    background: #b0b0b0;
    border: 3px solid #8c8c8c;
    border-radius: 18px;
    padding: 20px 12px;
    width: 100%;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  button:active { filter: brightness(0.8); }
  button:focus-visible { outline: 6px solid #fff; outline-offset: 4px; }

  /* ── Album picker ── */
  .albums { display: grid; gap: 18px; }
  .album-btn {
    display: flex; align-items: center; gap: 18px;
    text-align: left; background: #e4e4e4;
    padding: 14px 18px; min-height: 110px;
  }
  .album-btn img { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }

  /* ── Player ── */
  /* Cover on the left, song details beside it on the right. Sized by
     screen height too, so the buttons still fit without scrolling. */
  .now { display: flex; flex-direction: row; align-items: center; gap: 16px; margin-bottom: 20px; }
  /* Fixed-size box: its space is kept even while the picture loads
     or when a song has none, so the buttons never jump. */
  .now .art { width: min(46vw, 29vh, 340px); height: min(46vw, 29vh, 340px); border-radius: 14px; background: #222; overflow: hidden; flex-shrink: 0; }
  .now .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .now .art img[hidden] { display: none; }
  .now .art { position: relative; }
  .now .art-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 10px; text-align: center; color: #aaa; line-height: 1.2;
    font-size: clamp(14px, 3.6vw, 20px);
  }
  .now .art-msg[hidden] { display: none; }
  .now .art-msg.flash {
    color: #fff; font-weight: 900; font-size: clamp(16px, 4.2vw, 24px);
    animation: art-flash 1s ease-in-out infinite;
  }
  @keyframes art-flash {
    0%, 100% { opacity: 1; background: #1565c0; }
    50%      { opacity: 0.35; background: #222; }
  }
  .now-text { text-align: left; min-width: 0; flex: 1 1 0; }
  /* Always two lines tall, whether the name is short or long */
  .now .track {
    font-size: clamp(22px, 6vw, 38px); font-weight: bold; line-height: 1.2; max-height: 2.4em;
    word-break: break-word; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .now .track .year { color: #ffd400; white-space: nowrap; }
  .now .artist { font-size: clamp(18px, 4.6vw, 28px); font-weight: bold; color: #4fc3ff; margin-top: 6px; line-height: 1.2; }
  .now .from { font-size: clamp(15px, 3.8vw, 22px); color: #ddd; margin-top: 4px; line-height: 1.25; }
  .now .from:empty, .now .artist:empty { display: none; }
  .now .count { font-size: clamp(15px, 3.8vw, 22px); color: #aaa; margin-top: 6px; }

  /* Previous / Play / Next stay in one row, even on a phone */
  /* Icon buttons: plain drawn shapes, no text */
  .icon-btn { display: flex; align-items: center; justify-content: center; padding: 0; color: #111; }
  .icon-btn svg { fill: currentColor; display: block; }

  .controls { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 12px; margin-bottom: 18px; }
  .controls button { height: min(clamp(110px, 28vw, 150px), 18vh); }
  .controls svg { width: 58%; max-width: 90px; height: auto; }
  #btn-prev, #btn-next { background: #000; color: #ff8c00; border-color: #ff8c00; }
  #btn-play { background: #1e88e5; color: #fff; border-color: #64b5f6; }
  #btn-play svg { width: 46%; max-width: 80px; }
  #btn-play.playing { background: #1565c0; border-color: #90caf9; animation: play-flash 1.2s ease-in-out infinite; }
  /* Playing: the button gently flashes */
  @keyframes play-flash {
    0%, 100% { background: #1565c0; box-shadow: 0 0 0 0 rgba(100, 181, 246, 0); }
    50%      { background: #42a5f5; box-shadow: 0 0 22px 6px rgba(100, 181, 246, 0.75); }
  }
  @media (prefers-reduced-motion: reduce) { #btn-play.playing { animation-duration: 2.4s; } }

  /* Thumbs down / thumbs up */
  .rate { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .rate button { background: #3a3a3a; color: #cfcfcf; border-color: #555; height: min(clamp(50px, 12vw, 66px), 7.5vh); }
  .rate svg { width: clamp(32px, 8.5vw, 46px); height: auto; }
  /* Grey until pressed; pressing one hides the other until the next song */
  #btn-like.on { background: #64b5f6; color: #111; border-color: #bbdefb; }
  #btn-dislike.on { background: #7a7a7a; color: #111; }
  .rate button.gone { visibility: hidden; }


  .msg { text-align: center; font-size: clamp(20px, 5vw, 28px); margin-top: 16px; color: #ff6b6b; }

  /* Big Back button, pinned to the bottom of the screen */
  .back-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 16px calc(8px + env(safe-area-inset-bottom));
    background: #111;
    border-top: 3px solid #333;
    z-index: 10;
  }
  .back-bar button, .back-bar a {
    max-width: 820px; margin: 0 auto; display: block;
    text-align: center; text-decoration: none; color: #111;
    border: 3px solid #a8a8a8; border-radius: 18px;
    font-family: inherit;
    background: #c4c4c4;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 900;
    letter-spacing: 0.02em;
    -webkit-text-stroke: 1px #111;
    padding: 8px 12px;
  }
  .back-bar > button + *, .back-bar > a + * { margin-top: 22px; }
  .version {
    max-width: 820px; margin: 6px auto 0 !important;
    text-align: right; font-size: 13px; color: #777;
  }
  .back-bar [hidden] { display: none; }
  /* No buttons showing: just the version number, no bar */
  .back-bar.only-version { background: transparent; border-top: none; padding-top: 0; pointer-events: none; }

  /* ── Splash screen ── */
  .splash {
    position: fixed; inset: 0; z-index: 100;
    background: #111;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    transition: opacity 0.6s ease;
  }
  .splash.fade { opacity: 0; pointer-events: none; }
  .splash .logo { width: min(60vw, 45vh, 320px); height: auto; display: block; }
  .splash .credit {
    position: absolute; left: 16px; right: 16px;
    bottom: calc(24px + env(safe-area-inset-bottom));
    font-size: clamp(15px, 3.8vw, 20px); color: #888;
  }

  /* ── HELP button (top of every screen) and help screen ── */
  #btn-help { display: none; }   /* hidden for now — delete this line to bring it back */
  #btn-help {
    background: #ff3b30; color: #fff; border-color: #fff;
    font-size: clamp(22px, 5.5vw, 30px); font-weight: 900; letter-spacing: 0.08em;
    padding: 8px 12px; margin-bottom: 14px;
  }
  .radio-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .btn-radio {
    flex: 1 1 0; min-width: 0; background: #4a4a4a; color: #f2f2f2; border-color: #6e6e6e;
    font-size: clamp(15px, 3.8vw, 26px); font-weight: 900; letter-spacing: 0.04em; line-height: 1.15;
    padding: 8px 6px;
  }
  #btn-capdance   { background: #0d47a1; border-color: #5c8fe0; }
  #btn-heartdance { background: #1976d2; border-color: #64b5f6; }
  #btn-house      { background: #455a64; border-color: #78909c; }
  #btn-garage     { background: #607d8b; border-color: #90a4ae; }
  /* EMAIL under the radio buttons; CLOSE on its own further down.
     Both full width, so the same length. */
  #btn-email, #btn-close {
    display: block; width: 100%; color: #fff;
    font-size: clamp(20px, 5vw, 30px); font-weight: 900; letter-spacing: 0.08em;
    padding: 8px 12px;
  }
  .recipes-layer { position: fixed; inset: 0; z-index: 95; background: #111; }
  .recipes-layer[hidden] { display: none; }
  .recipes-layer iframe { width: 100%; height: 100%; border: 0; display: block; }
  #btn-camera {
    display: block; width: 100%; margin-top: 18px; padding: 8px 12px;
    background: #263238; color: #fff; border-color: #64b5f6;
    font-size: clamp(20px, 5vw, 30px); font-weight: 900; letter-spacing: 0.06em;
  }
  .photo-layer {
    position: fixed; inset: 0; z-index: 96; background: #000;
    display: flex; flex-direction: column; gap: 14px;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }
  .photo-layer[hidden] { display: none; }
  .photo-layer img { flex: 1 1 auto; min-height: 0; width: 100%; object-fit: contain; }
  #btn-photo-save { background: #1565c0; color: #fff; border-color: #64b5f6; padding: 12px; }
  #btn-photo-close { background: #c4c4c4; color: #111; border-color: #a8a8a8; padding: 12px; }
  #btn-recipes {
    display: block; width: 100%; margin-top: 18px; padding: 8px 12px;
    background: #546e7a; color: #fff; border-color: #90a4ae;
    font-size: clamp(20px, 5vw, 30px); font-weight: 900; letter-spacing: 0.06em;
  }
  #btn-email { background: #1565c0; border-color: #64b5f6; margin-top: 18px; }
  /* RATE THIS APP: thin, black, bold white text */
  #btn-rate {
    display: block; width: 100%; margin-top: 18px; padding: 6px 12px;
    background: #000; color: #fff; border: 2px solid #fff; border-radius: 12px;
    font-size: clamp(16px, 4.2vw, 22px); font-weight: 900; letter-spacing: 0.1em;
  }
  .stars { display: flex; gap: 8px; margin-top: 10px; }
  .stars[hidden] { display: none; }
  .stars button {
    flex: 1 1 0; min-width: 0; padding: 6px 0; background: #000; color: #ffd400;
    border: 2px solid #555; border-radius: 12px; font-size: clamp(24px, 7vw, 36px); line-height: 1;
  }
  #btn-close { background: #37474f; border-color: #78909c; margin-top: 44px; }
  .help {
    position: fixed; inset: 0; z-index: 90;
    background: #111;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .help[hidden] { display: none; }
  .help .help-inner { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 22px; }
  #btn-send-help {
    background: #ff3b30; color: #fff;
    font-size: clamp(30px, 8.5vw, 48px); font-weight: 900; line-height: 1.2;
    min-height: 40vh;
  }
  #btn-send-help:disabled { cursor: default; }
  #btn-send-help.sent { background: #3ddc84; color: #111; }
  .help .help-status { font-size: clamp(22px, 5.5vw, 30px); min-height: 1.4em; color: #ccc; }
  .help .help-status a { color: #4fc3ff; }
  #btn-help-close { background: #c4c4c4; }

</head>
<body>
<div class="splash" id="splash" onclick="hideSplash()">
  <img class="logo" src="assets/dp-logo.webp" alt="dPaul">
  <div class="credit">Developed by David Ahern - DPAUL 2026</div>
</div>
<div class="help" id="help" hidden role="dialog" aria-modal="true" aria-label="Help">
  <div class="help-inner">
    <button id="btn-send-help" onclick="sendHelp()">EMERGENCY ONLY</button>
    <div class="help-status" id="help-status" aria-live="polite"></div>
    <button id="btn-help-close" onclick="closeHelp()">GO BACK</button>
  </div>
</div>
<div class="wrap">

  <button id="btn-help" onclick="openHelp()">EMERGENCY ONLY</button>

  <!-- Screen 1: pick an album -->
  <div id="picker">
    <h1>Choose an Album</h1>
    <div class="albums" id="album-list"></div>
  </div>

  <!-- Screen 2: play it -->
  <div id="player" hidden>
    <div class="now">
      <div class="art"><img id="cover" alt="" hidden><div class="art-msg" id="art-msg" hidden>search for album art</div></div>
      <div class="now-text">
        <div class="track" id="track-name"></div>
        <div class="artist" id="track-artist"></div>
        <div class="from" id="track-from"></div>
        <div class="count" id="track-count"></div>
      </div>
    </div>

    <div class="controls">
      <button class="icon-btn" id="btn-prev" onclick="prevTrack()" aria-label="Previous song">
        <svg viewBox="0 0 100 60"><polygon points="50,0 50,60 0,30"/><polygon points="100,0 100,60 50,30"/></svg>
      </button>
      <button class="icon-btn" id="btn-play" onclick="togglePlay()" aria-label="Play"></button>
      <button class="icon-btn" id="btn-next" onclick="nextTrack()" aria-label="Next song">
        <svg viewBox="0 0 100 60"><polygon points="0,0 0,60 50,30"/><polygon points="50,0 50,60 100,30"/></svg>
      </button>
    </div>

    <div class="rate">
      <button class="icon-btn" id="btn-dislike" onclick="dislikeSong()" aria-label="Don't like this song – skip it and never play it again">
        <svg viewBox="0 0 24 24"><g transform="rotate(180 12 12)"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></g></svg>
      </button>
      <button class="icon-btn" id="btn-like" onclick="toggleLike()" aria-label="Like this song" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
      </button>
    </div>

    <div class="radio-row">
      <button class="btn-radio" id="btn-capdance" onclick="toggleRadio('capdance')">CAPITAL DANCE</button>
      <button class="btn-radio" id="btn-heartdance" onclick="toggleRadio('heartdance')">HEART DANCE</button>
      <button class="btn-radio" id="btn-house" onclick="toggleRadio('house')">HOUSE</button>
      <button class="btn-radio" id="btn-garage" onclick="toggleRadio('garage')">UK GARAGE</button>
    </div>

    <button id="btn-recipes" onclick="openRecipes()">STUDENT RECIPES</button>

    <button id="btn-camera" onclick="openCamera()">CAMERA</button>
    <input type="file" id="camera-input" accept="image/*" capture="environment" hidden onchange="gotPhoto(this)">

    <button id="btn-email" onclick="openEmail()">EMAIL</button>

    <button id="btn-rate" onclick="toggleStars()">RATE THIS APP</button>
    <div class="stars" id="stars" hidden>
      <button onclick="rateApp(1)" aria-label="1 star">★</button>
      <button onclick="rateApp(2)" aria-label="2 stars">★</button>
      <button onclick="rateApp(3)" aria-label="3 stars">★</button>
      <button onclick="rateApp(4)" aria-label="4 stars">★</button>
      <button onclick="rateApp(5)" aria-label="5 stars">★</button>
    </div>

    <button id="btn-close" onclick="location.href='https://www.google.com'">CLOSE</button>

    <div class="msg" id="msg"></div>
  </div>

  <div class="back-bar" id="back-bar">
    <button id="btn-controls" onclick="showPlayer()" hidden>BACK TO CONTROLS</button>
    <div class="version" id="version"></div>
  </div>

  <audio id="audio" preload="auto" playsinline></audio>
</div>
<!-- Student recipes open on top of the player, so the music keeps playing -->
<div class="photo-layer" id="photo-layer" hidden>
  <img id="photo" alt="Your photo">
  <button id="btn-photo-save" onclick="savePhoto()">SAVE PHOTO</button>
  <button id="btn-photo-close" onclick="closePhoto()">BACK TO MUSIC</button>
</div>
<div class="recipes-layer" id="recipes-layer" hidden>
  <iframe id="recipes-frame" title="Student recipes"></iframe>
</div>

const PLAY_ICON  = '<svg viewBox="0 0 52 60"><polygon points="0,0 0,60 52,30"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 52 60"><rect x="0" y="0" width="18" height="60" rx="2"/><rect x="34" y="0" width="18" height="60" rx="2"/></svg>';

const audio = document.getElementById('audio');
const playBtn = document.getElementById('btn-play');
const msg = document.getElementById('msg');

let album = null;
let trackIndex = 0;   // position in the shuffled play order
let order = [];       // album.tracks indexes, shuffled each time an album opens

// ── Thumbs up / down ──
// Saved on this phone/tablet only. 1 = liked, -1 = disliked.
let ratings = {};
try { ratings = JSON.parse(localStorage.getItem('ratings')) || {}; } catch (e) {}
function saveRatings() { try { localStorage.setItem('ratings', JSON.stringify(ratings)); } catch (e) {} }
function ratingKey(file) { return album.folder + '/' + file; }
function ratingOf(file) { return ratings[ratingKey(file)] || 0; }

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Liked songs first (shuffled), then the rest (shuffled).
// Disliked songs are left out altogether.
function shuffledOrder() {
  const idx = album.tracks.map((_, i) => i);
  const liked = idx.filter(i => ratingOf(album.tracks[i]) > 0);
  const other = idx.filter(i => ratingOf(album.tracks[i]) === 0);
  const result = shuffle(liked).concat(shuffle(other));
  if (result.length) return result;
  // Every song disliked — forget those dislikes rather than play nothing
  album.tracks.forEach(f => delete ratings[ratingKey(f)]);
  saveRatings();
  return shuffle(idx);
}

function toggleLike() {
  if (!album) return;
  const k = ratingKey(currentFile());
  if (ratings[k] > 0) delete ratings[k]; else ratings[k] = 1;
  saveRatings();
  updateLikeButton();
}

function dislikeSong() {
  if (!album) return;
  ratings[ratingKey(currentFile())] = -1;
  saveRatings();
  // Show it pressed (and thumbs up gone) for a moment, then skip
  document.getElementById('btn-dislike').classList.add('on');
  document.getElementById('btn-like').classList.add('gone');
  document.querySelectorAll('.rate button').forEach(b => b.disabled = true);
  const file = currentFile();
  setTimeout(() => skipDisliked(file), 600);
}

function skipDisliked(file) {
  document.querySelectorAll('.rate button').forEach(b => b.disabled = false);
  if (currentFile() !== file) {                // moved on meanwhile: just drop it from the list
    const pos = order.findIndex(i => album.tracks[i] === file);
    if (pos >= 0) { order.splice(pos, 1); if (pos < trackIndex) trackIndex--; }
    if (!order.length) { order = shuffledOrder(); trackIndex = 0; }
    document.getElementById('track-count').textContent =
      'Song ' + (trackIndex + 1) + ' of ' + order.length;
    return;
  }
  order.splice(trackIndex, 1);                 // never comes round again
  if (!order.length) order = shuffledOrder();
  if (trackIndex >= order.length) trackIndex = 0;
  loadTrack(trackIndex, true);                 // skip straight to the next one
}

function updateLikeButton() {
  const liked = album && ratingOf(currentFile()) > 0;
  const btn = document.getElementById('btn-like');
  btn.classList.toggle('on', !!liked);
  btn.classList.remove('gone');
  btn.setAttribute('aria-pressed', liked ? 'true' : 'false');
  const down = document.getElementById('btn-dislike');
  down.classList.remove('on');
  down.classList.toggle('gone', !!liked);   // thumbs up pressed: thumbs down hides
}

function currentFile() { return album.tracks[order[trackIndex]]; }

function fileUrl(folder, file) {
  return encodeURIComponent(folder) + '/' + encodeURIComponent(file);
}

// Display name: drop ".mp3", " copy", a leading track number, tidy underscores
function niceName(file) {
  return file
    .replace(/\.mp3$/i, '')
    .replace(/\s+copy(\s+\d+)?$/i, '')
    .replace(/\s*\(\d+\)$/, '')
    .replace(/_t\b/g, "'t").replace(/_s\b/g, "'s")
    .replace(/_/g, ' ');
}

function buildPicker() {
  const list = document.getElementById('album-list');
  list.innerHTML = '';
  ALBUMS.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.className = 'album-btn';
    btn.onclick = () => openAlbum(i);
    const img = document.createElement('img');
    img.src = fileUrl(a.folder, a.cover || 'cover.jpg');
    img.alt = '';
    img.onerror = () => img.remove();   // no cover image? just the name
    btn.appendChild(img);
    const label = document.createElement('span');
    label.textContent = a.title;
    btn.appendChild(label);
    list.appendChild(btn);
  });
}

function openAlbum(i, autoplay = true) {
  if (album === ALBUMS[i]) { showPlayer(); return; }
  album = ALBUMS[i];
  order = shuffledOrder();   // a different song first each time
  // Never open on the song that was on last time (or a liked song
  // always coming first): swap it with a random later one.
  let last = null;
  try { last = localStorage.getItem('lastSong'); } catch (e) {}
  if (order.length > 1 && ratingKey(album.tracks[order[0]]) === last) {
    const j = 1 + Math.floor(Math.random() * (order.length - 1));
    [order[0], order[j]] = [order[j], order[0]];
  }


  showPlayer();
  loadTrack(0, autoplay);
}

function showPicker() {
  document.getElementById('player').hidden = true;
  document.getElementById('picker').hidden = false;
  document.getElementById('btn-controls').hidden = !album;   // only once something is loaded
  fitBackBar();
  window.scrollTo(0, 0);
}

function showPlayer() {
  document.getElementById('picker').hidden = true;
  document.getElementById('player').hidden = false;
  document.getElementById('btn-controls').hidden = true;
  fitBackBar();
  window.scrollTo(0, 0);
}

function loadTrack(i, autoplay) {
  if (!album || !order.length) return;
  trackIndex = (i + order.length) % order.length;
  setRadioMode(false);
  const file = currentFile();
  try { localStorage.setItem('lastSong', ratingKey(file)); } catch (e) {}
  audio.src = fileUrl(album.folder, file);
  showArt(file);
  const nameEl = document.getElementById('track-name');
  nameEl.textContent = niceName(file);
  const year = album.years && album.years[file];
  if (year) {
    const y = document.createElement('span');
    y.className = 'year';
    y.textContent = ' (' + year + ')';
    nameEl.appendChild(y);
  }
  const inf = trackInfo(file);
  document.getElementById('track-artist').textContent = inf ? inf[0] : '';
  document.getElementById('track-from').textContent = inf
    ? (inf[1].endsWith('(single)') ? 'Single: ' + inf[1].replace(/\s*\(single\)$/, '')
                                   : 'Album: ' + inf[1]) + ' (' + inf[2] + ')'
    : '';
  document.getElementById('track-count').textContent =
    'Song ' + (trackIndex + 1) + ' of ' + order.length;
  updateLikeButton();
  msg.textContent = '';
  if (autoplay) play(); else updatePlayButton();
}

// ── Album art ──
// Picture embedded in the MP3 first; failing that the album's cover
// image (cover.jpg unless the ALBUMS list names another); failing that,
// nothing — the page simply has no picture.
const coverEl = document.getElementById('cover');
let artToken = 0;

// No picture (none for this song, it failed, or it still hasn't loaded
// after a minute): a flashing "looking for artwork" fills the box instead.
let artTimer = null;
function artMissing() {
  const artMsg = document.getElementById('art-msg');
  coverEl.hidden = true;
  artMsg.textContent = 'looking for artwork';
  artMsg.classList.add('flash');
  artMsg.hidden = false;
}
function setArt(src) {
  const artMsg = document.getElementById('art-msg');
  clearTimeout(artTimer);
  artMsg.classList.remove('flash');
  artMsg.textContent = 'search for album art';
  if (!src) { coverEl.removeAttribute('src'); artMissing(); updateMediaSession(null); return; }
  // Shown while the picture loads
  coverEl.hidden = true; artMsg.hidden = false;
  artTimer = setTimeout(artMissing, 60000);
  coverEl.onerror = () => { clearTimeout(artTimer); artMissing(); };
  coverEl.onload = () => { clearTimeout(artTimer); artMsg.classList.remove('flash'); coverEl.hidden = false; artMsg.hidden = true; };
  coverEl.src = src;
  updateMediaSession(src);
}

function trackInfo(file) { return album && album.info && album.info[file]; }

// Original sleeve for this song, or no picture if there isn't one
function showArt(file) {
  artToken++;
  const inf = trackInfo(file);
  setArt(inf && inf[3] ? 'assets/covers/' + encodeURIComponent(inf[3]) : null);
}

function updateMediaSession(artSrc) {
  if (!('mediaSession' in navigator) || !album || radio) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: niceName(currentFile()),
    artist: (trackInfo(currentFile()) || [])[0] || '',
    album: (trackInfo(currentFile()) || [])[1] || album.title,
    artwork: artSrc ? [{ src: new URL(artSrc, location.href).href }] : []
  });
}

// ── Radio stations ──
// Plays a live stream through the same player, so music and radio
// never play at once. Tapping the playing station's button again (or
// a skip button) goes back to the songs.
const STATIONS = {
  capdance:   { name: 'Capital Dance',    label: 'CAPITAL DANCE', url: 'https://media-ssl.musicradio.com/CapitalDanceMP3', art: 'assets/capdance.svg' },
  heartdance: { name: 'Heart Dance',      label: 'HEART DANCE',   url: 'https://media-ssl.musicradio.com/HeartDanceMP3',   art: 'assets/heartdance.svg' },
  house:      { name: 'House Party',      label: 'HOUSE',         url: 'https://listen.reyfm.de/houseparty_192kbps.mp3',  art: 'assets/house.svg' },
  garage:     { name: 'UK Garage',        label: 'UK GARAGE',     url: 'https://ukg.algorythmeradio.com/stream',           art: 'assets/garage.svg' }
};
let radio = null;                              // key of the station playing, or null for music

function setRadioMode(key) {
  radio = key || null;
  for (const k in STATIONS) {
    document.getElementById('btn-' + k).textContent = radio === k ? 'BACK TO MUSIC' : STATIONS[k].label;
  }
  document.querySelector('.rate').style.visibility = radio ? 'hidden' : '';
}

function toggleRadio(key) {
  if (radio === key) { loadTrack(trackIndex, true); return; }
  const st = STATIONS[key];
  setRadioMode(key);
  artToken++;                                  // ignore any song picture still loading
  setArt(st.art);
  document.getElementById('track-name').textContent = st.name;
  document.getElementById('track-artist').textContent = '';
  document.getElementById('track-from').textContent = '';
  document.getElementById('track-count').textContent = 'Live';
  msg.textContent = '';
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: st.name, album: 'Live',
      artwork: [{ src: new URL(st.art, location.href).href }]
    });
  }
  audio.src = st.url;
  play();
}

function play() {
  // Live radio: reconnect so it carries on from now, not from the pause
  if (radio && audio.paused) audio.src = STATIONS[radio].url;
  // Phones sometimes block sound until a button is pressed — if so,
  // the PLAY button is left showing so one tap starts it.
  audio.play().catch(updatePlayButton);
}

function togglePlay() { if (audio.paused) play(); else audio.pause(); }
function nextTrack() { loadTrack(radio ? trackIndex : trackIndex + 1, true); }

function prevTrack() {
  // A few seconds in, Prev restarts the song, like a CD player
  if (radio) { loadTrack(trackIndex, true); return; }
  if (audio.currentTime > 5) { audio.currentTime = 0; return; }
  loadTrack(trackIndex - 1, true);
}


function updatePlayButton() {
  const playing = !audio.paused;
  playBtn.innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
  playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  playBtn.classList.toggle('playing', playing);
}

audio.addEventListener('play', updatePlayButton);
audio.addEventListener('pause', updatePlayButton);
audio.addEventListener('ended', () => {
  if (radio) { updatePlayButton(); return; }
  if (trackIndex < order.length - 1) nextTrack();
  else updatePlayButton();
});
audio.addEventListener('error', () => {
  msg.textContent = radio ? STATIONS[radio].name + ' could not be reached.' : 'This song could not be found.';
  updatePlayButton();
});

// Lock-screen / headphone controls on phones
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', play);
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
  navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
}

// CAMERA: opens the phone's own camera. The photo is then shown with
// SAVE PHOTO (the phone's share sheet, where "Save Image" puts it in
// Photos) — browsers can't save to the camera roll by themselves.
let photoFile = null, photoUrl = null;
function openCamera() { document.getElementById('camera-input').click(); }
function gotPhoto(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  photoFile = f;
  if (photoUrl) URL.revokeObjectURL(photoUrl);
  photoUrl = URL.createObjectURL(f);
  document.getElementById('photo').src = photoUrl;
  document.getElementById('photo-layer').hidden = false;
}
async function savePhoto() {
  if (!photoFile) return;
  const file = new File([photoFile], 'photo-' + Date.now() + '.jpg', { type: photoFile.type || 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) {}   // cancelled: nothing to do
    return;
  }
  const a = document.createElement('a');   // no share sheet: download it instead
  a.href = photoUrl; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}
function closePhoto() { document.getElementById('photo-layer').hidden = true; }

let helpSending = false;
let helpLocation = null;   // Promise of { link, accuracy } or { error }

// Asks the phone where it is. The phone may ask "Allow location?" the
// first time. Never rejects: gives back either a place or a reason.
function findLocation() {
  return new Promise(resolve => {
    if (!('geolocation' in navigator)) return resolve({ error: 'not supported on this device' });
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude: lat, longitude: lon, accuracy } = pos.coords;
        resolve({
          link: 'https://www.google.com/maps?q=' + lat.toFixed(6) + ',' + lon.toFixed(6),
          accuracy: 'about ' + Math.round(accuracy) + ' metres'
        });
      },
      err => resolve({ error: err.code === 1 ? 'permission was refused' :
                              err.code === 3 ? 'took too long to find' : 'could not be found' }),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  });
}

function openHelp() {
  audio.pause();
  // Start finding the location now, so it is usually ready by the tap
  helpLocation = findLocation();
  const btn = document.getElementById('btn-send-help');
  btn.disabled = false;
  btn.classList.remove('sent');
  btn.textContent = 'EMERGENCY ONLY';
  document.getElementById('help-status').textContent = '';
  document.getElementById('help').hidden = false;
}

function closeHelp() {
  document.getElementById('help').hidden = true;
}

async function sendHelp() {
  if (helpSending) return;
  helpSending = true;
  const btn = document.getElementById('btn-send-help');
  const status = document.getElementById('help-status');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  status.textContent = '';
  const when = new Date().toLocaleString('en-GB');
  const song = (album && album.tracks.length) ? niceName(currentFile()) : '';
  // Wait up to 8 seconds for the location, then send without it
  status.textContent = 'Finding where you are…';
  const place = await Promise.race([
    helpLocation || findLocation(),
    new Promise(r => setTimeout(() => r({ error: 'took too long to find' }), 8000))
  ]);
  status.textContent = '';
  try {
    const res = await fetch('https://formsubmit.co/ajax/' + HELP_EMAIL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: 'Dad needs help',
        _template: 'box',
        message: 'Dad needs help. He pressed the EMERGENCY ONLY button in Simple Play.',
        time: when,
        location: place.link || ('Not available – ' + place.error),
        location_accuracy: place.accuracy || '',
        last_song: song,
        device: navigator.userAgent
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || String(data.success) !== 'true') throw new Error(data.message || 'not sent');
    btn.classList.add('sent');
    btn.textContent = 'Help has been asked for';
    status.textContent = 'An email has been sent.';
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'EMERGENCY ONLY';
    const body = encodeURIComponent('Dad needs help. (Sent from Simple Play, ' + when + ')' +
      (place.link ? '\nWhere I am: ' + place.link : ''));
    status.innerHTML = 'It did not send. Tap the button to try again, or <a href="mailto:' +
      HELP_EMAIL + '?subject=' + encodeURIComponent('Dad needs help') + '&body=' + body +
      '">send an email instead</a>.';
  } finally {
    helpSending = false;
  }
}

// Splash shows for a few seconds, then fades; a tap skips it
function hideSplash() {
  const el = document.getElementById('splash');
  if (!el || el.classList.contains('fade')) return;
  el.classList.add('fade');
  setTimeout(() => el.remove(), 700);
}
setTimeout(hideSplash, 3000);

updatePlayButton();
buildPicker();
// Open straight onto the controls with the first album ready —
// not playing yet, one tap on Play starts it.
openAlbum(0, false);
</script>
</body>
